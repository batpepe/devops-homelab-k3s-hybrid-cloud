# The site ships as a per-commit immutable image, so clients must revalidate on
# every load for a deploy to be visible immediately. no-cache (not no-store)
# keeps repeat loads cheap (ETag 304s) and stops Cloudflare from applying its
# default 4h browser TTL, which kept visitors on a stale build after deploys.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }
}
