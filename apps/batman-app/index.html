<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Batman: Shadows of Gotham</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-root">
    <canvas id="game"></canvas>

    <!-- HUD overlay (non-interactive) -->
    <div id="hud">
      <div id="hud-health" class="hud-tl"></div>
      <div class="hud-tr">
        <div id="cd-batarang" class="dial"><span>BAT</span></div>
        <div id="cd-dash" class="dial"><span>DSH</span></div>
      </div>
      <div id="hud-combo" class="hidden">
        <span>0x</span>
        <div class="combo-bar"><div id="combo-fill"></div></div>
      </div>
    </div>

    <!-- Start menu -->
    <div id="menu-start" class="menu">
      <div class="menu-box">
        <h1>BATMAN</h1>
        <h2>Shadows of Gotham</h2>
        <button id="btn-start">ENTER GOTHAM</button>
        <div class="controls">
          <p><b>Move</b> WASD / Arrows &nbsp;&nbsp; <b>Jump</b> Space (double)</p>
          <p><b>Attack</b> J / Left-Click &nbsp;&nbsp; <b>Parry</b> K / Right-Click</p>
          <p><b>Dash</b> Shift &nbsp;&nbsp; <b>Batarang</b> Q &nbsp;&nbsp; <b>Grapple</b> E</p>
          <p class="dim">Mobile: on-screen joystick and action buttons</p>
        </div>
      </div>
    </div>

    <!-- Game over -->
    <div id="menu-over" class="menu hidden">
      <div class="menu-box">
        <h1 id="over-text">YOU FELL</h1>
        <button id="btn-restart">RETRY</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
