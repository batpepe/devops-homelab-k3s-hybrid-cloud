---
- name: Setup Cloud Web Server with Docker
  hosts: webservers
  become: yes

  tasks:
    - name: Install Docker and required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - docker.io
          - python3-docker
        state: present
        update_cache: yes

    - name: Ensure Docker is running and enabled on boot
      service:
        name: docker
        state: started
        enabled: yes

    - name: Run Nginx web server container
      docker_container:
        name: my_cloud_website
        image: nginx:1.27-alpine
        state: started
        restart_policy: always
        recreate: yes
        ports:
          - "80:80"
