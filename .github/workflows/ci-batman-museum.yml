name: Build Batman Museum

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/batman-museum/**'
      - '.github/workflows/ci-batman-museum.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: batpepe/batman-museum

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/batman-museum
          push: true
          # Uncached on purpose: a cached "apk upgrade" layer freezes packages at
          # cache-write time, so new CVE fixes never enter the image and the Trivy
          # gate fails on a stale layer. The rebuild costs little.
          pull: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Smoke test the image
        run: |
          docker run -d --rm --name museum-smoke -p 8080:3000 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health || true)
            if [ "$code" = "200" ]; then echo "health ok"; docker stop museum-smoke; exit 0; fi
            sleep 2
          done
          echo "health check failed"; docker logs museum-smoke; docker stop museum-smoke; exit 1

      - name: Update K8s manifest
        run: |
          sed -i -E "s|image: ghcr.io/batpepe/batman-museum:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|" k8s-infrastructure/apps/batman-museum/batman-museum.yaml
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add k8s-infrastructure/apps/batman-museum/batman-museum.yaml
          git commit -m "gitops: update batman-museum image to ${{ github.sha }}" || echo "No changes"
          for i in $(seq 1 5); do
            git pull --rebase origin main && git push && exit 0
            echo "manifest push attempt $i failed; retrying" >&2
            sleep $((RANDOM % 5 + 1))
          done
          echo "manifest push failed after 5 attempts" >&2
          exit 1
