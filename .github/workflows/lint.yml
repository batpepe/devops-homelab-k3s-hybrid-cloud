name: Lint

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/**/Dockerfile'
      - 'k8s-infrastructure/**'
      - 'terraform/**'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hadolint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - apps/nginx-app/Dockerfile
          - apps/nodejs-app/Dockerfile
          - apps/flask-app/Dockerfile
          - apps/batman-app/Dockerfile
          - apps/batman-museum/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: hadolint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        continue-on-error: true
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: error
          format: tty

  kube-linter:
    name: Kubernetes manifest lint (kube-linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: kube-linter k8s-infrastructure/
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1.0.7
        continue-on-error: true
        with:
          directory: k8s-infrastructure
          format: plain

  terraform-fmt:
    name: Terraform format (fmt -check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The ubuntu-24.04 runner image no longer preinstalls terraform
      # (exit 127 on 2026-07-03); provision it explicitly.
      - name: Install terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: terraform fmt -check -recursive
        run: terraform fmt -check -recursive -diff

  trivy-iac:
    name: Terraform misconfig scan (trivy config)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: trivy config terraform/
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        # Enforcing since 2026-07-05: findings triaged to zero (fixed or
        # ignored inline with a written rationale), so new ones now gate.
        with:
          scan-type: 'config'
          scan-ref: 'terraform'
          format: 'table'
          exit-code: '1'

  yamllint:
    name: YAML lint (yamllint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: yamllint
        # Report-only while existing findings are triaged, like the other linters.
        continue-on-error: true
        run: docker run --rm -v "$PWD":/data cytopia/yamllint:latest -c .yamllint.yml k8s-infrastructure ansible .github/workflows

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: actionlint
        # Report-only while existing warnings are triaged, like the other linters.
        continue-on-error: true
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color
