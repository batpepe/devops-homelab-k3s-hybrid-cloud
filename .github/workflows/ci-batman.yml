name: Build Batman Game

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/batman-app/**'
      - '.github/workflows/ci-batman.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: batpepe/batman-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v3
      
      - uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: docker/build-push-action@v4
        with:
          context: ./apps/batman-app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            
      - name: Update K8s manifest
        run: |
          sed -i -E "s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s-infrastructure/apps/nginx/batman.yaml
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add k8s-infrastructure/apps/nginx/batman.yaml
          git commit -m "gitops: update batman-app image to ${{ github.sha }}" || echo "No changes"
          git pull --rebase origin main
          git push
