name: Build Batman Game

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/batman-app/**'
      - '.github/workflows/ci-batman.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: batpepe/batman-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/batman-app
          push: true
          # Uncached on purpose: a cached "apk upgrade" layer freezes packages at
          # cache-write time, so new CVE fixes never enter the image and the Trivy
          # gate fails on a stale layer (seen with CVE-2026-45447). The image is a
          # tiny static site; the rebuild costs seconds.
          pull: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Smoke test the built image
        working-directory: apps/batman-app/test
        env:
          BASE_URL: http://localhost:8080
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          docker run -d --rm --name batman-smoke -p 8080:80 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ >/dev/null && break; sleep 1; done
          set +e; npx playwright test; status=$?; set -e
          docker stop batman-smoke >/dev/null 2>&1 || true
          exit $status

      - name: Update K8s manifest
        run: |
          sed -i -E "s|image: ghcr.io/batpepe/batman-app:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|" k8s-infrastructure/apps/nginx/batman.yaml
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add k8s-infrastructure/apps/nginx/batman.yaml
          git commit -m "gitops: update batman-app image to ${{ github.sha }}" || echo "No changes"
          for i in $(seq 1 5); do
            git pull --rebase origin main && git push && exit 0
            echo "manifest push attempt $i failed; retrying" >&2
            sleep $((RANDOM % 5 + 1))
          done
          echo "manifest push failed after 5 attempts" >&2
          exit 1
