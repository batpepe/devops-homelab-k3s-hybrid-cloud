name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/flask-app/**' # Запускати тільки якщо змінився код аппки

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: batpepe/flask-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ВАЖЛИВО: Змінили read на write, щоб бот міг робити коміти
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/flask-app
          push: true
          # Пушимо ДВА теги: latest (для історії) і унікальний SHA коміту (для ArgoCD)
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update Kubernetes manifest with new image tag
        run: |
          # Ця команда знаходить рядок з image: і замінює старий тег на новий унікальний
          sed -i -E "s|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s-infrastructure/apps/flask/flask-app.yaml

      - name: Commit and push changes to GitOps repo
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add k8s-infrastructure/apps/flask/flask-app.yaml
          git commit -m "gitops: update flask-app image tag to ${{ github.sha }}"
          git push
