name: Build Portal App

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/portal/**'
      - '.github/workflows/ci-portal.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: batpepe/portal

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/portal
          push: true
          # Uncached on purpose: a cached "apk upgrade" layer freezes packages at
          # cache-write time, so new CVE fixes never enter the image and the Trivy
          # gate fails on a stale layer (seen with CVE-2026-45447). The image is
          # small; the rebuild costs seconds.
          pull: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Smoke test the image
        run: |
          docker run -d --rm --name portal-smoke -p 8080:80 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          for _ in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            if [ "$code" = "200" ]; then echo "serving ok"; docker stop portal-smoke; exit 0; fi
            sleep 2
          done
          echo "smoke check failed"; docker logs portal-smoke; docker stop portal-smoke; exit 1

      - name: Update K8s manifest
        run: |
          sed -i -E "s|image: ghcr.io/batpepe/portal:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|" k8s-infrastructure/apps/portal/portal.yaml
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add k8s-infrastructure/apps/portal/portal.yaml
          git commit -m "gitops: update portal image to ${{ github.sha }}" || echo "No changes"
          for i in $(seq 1 5); do
            git pull --rebase origin main && git push && exit 0
            echo "manifest push attempt $i failed; retrying" >&2
            sleep $((RANDOM % 5 + 1))
          done
          echo "manifest push failed after 5 attempts" >&2
          exit 1
