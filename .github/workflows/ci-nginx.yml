name: Build Nginx App

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/nginx-app/**'
      - '.github/workflows/ci-nginx.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: batpepe/nginx-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./apps/nginx-app
          push: true
          # Uncached on purpose: a cached "apk upgrade" layer freezes packages at
          # cache-write time, so new CVE fixes never enter the image and the Trivy
          # gate fails on a stale layer (seen with CVE-2026-45447). The image is
          # small; the rebuild costs seconds.
          pull: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Update K8s manifest
        run: |
          sed -i -E "s|image: ghcr.io/batpepe/nginx-app:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|" k8s-infrastructure/apps/nginx/nginx-app.yaml
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add k8s-infrastructure/apps/nginx/nginx-app.yaml
          git commit -m "gitops: update nginx-app image to ${{ github.sha }}" || echo "No changes"
          for i in $(seq 1 5); do
            git pull --rebase origin main && git push && exit 0
            echo "manifest push attempt $i failed; retrying" >&2
            sleep $((RANDOM % 5 + 1))
          done
          echo "manifest push failed after 5 attempts" >&2
          exit 1
