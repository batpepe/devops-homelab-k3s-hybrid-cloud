apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 58.2.2 # Стабільна версія чарту
    helm:
      releaseName: monitoring
      values: |
        grafana:
          adminPassword: "prom-operator" # Можеш змінити на свій пароль
          # Тут у майбутньому ми зможемо прописувати наші алерти для Telegram!
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # Це важливо для великих налаштувань Prometheus
