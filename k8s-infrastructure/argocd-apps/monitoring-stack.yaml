apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 58.2.2
    helm:
      releaseName: monitoring
      values: |
        grafana:
          # Create the secret manually, with BOTH keys:
          # kubectl create secret generic grafana-admin-secret -n monitoring \
          #   --from-literal=admin-user=admin \
          #   --from-literal=admin-password=<your-password>
          admin:
            existingSecret: grafana-admin-secret
            userKey: admin-user
            passwordKey: admin-password

          # Chart-managed ingress; replaces the ingress that was once
          # hand-applied outside Git.
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.local
              - grafana.batpepe.online
          
          # The chart's sidecar provisions its own default Prometheus
          # datasource; two defaults make Grafana refuse to start, so it is
          # disabled in favor of the explicit one below (dashboards pin its
          # uid "prometheus").
          sidecar:
            datasources:
              defaultDatasourceEnabled: false

          # Single source of truth for grafana datasources; the kps default
          # block and the loki-stack datasource ConfigMap are both disabled.
          additionalDataSources:
            - name: Prometheus
              type: prometheus
              uid: prometheus
              url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
              access: proxy
              isDefault: true
              jsonData:
                httpMethod: POST
            - name: Alertmanager
              type: alertmanager
              uid: alertmanager
              url: http://monitoring-kube-prometheus-alertmanager.monitoring.svc:9093
              access: proxy
              jsonData:
                handleGrafanaManagedAlerts: false
                implementation: prometheus
            - name: Loki
              type: loki
              uid: loki
              url: http://loki.monitoring.svc:3100
              access: proxy

          envValueFrom:
            TG_BOT_TOKEN:
              secretKeyRef:
                name: tg-secret
                key: bottoken
            TG_CHAT_ID:
              secretKeyRef:
                name: tg-secret
                key: chatid

          alerting:
            contactpoints.yaml:
              apiVersion: 1
              contactPoints:
                - orgId: 1
                  name: Telegram
                  receivers:
                    - uid: tg_bot
                      type: telegram
                      settings:
                        bottoken: "${TG_BOT_TOKEN}"
                        chatid: "${TG_CHAT_ID}"
                        message: '{{ `{{ template "custom_tg_alert" . }}` }}'
                        parseMode: "HTML"
            policies.yaml:
              apiVersion: 1
              policies:
                - orgId: 1
                  receiver: Telegram
                  group_by: ['alertname', 'namespace']
                  group_wait: 10s
                  group_interval: 1m
                  repeat_interval: 10m
            templates.yaml:
              apiVersion: 1
              templates:
                - orgId: 1
                  name: custom_tg_alert
                  # The body is Grafana templating, not Helm. The chart runs
                  # helm tpl over alerting values, so the braces must be kept
                  # inside a raw-string literal or rendering fails.
                  template: |
                    {{ `
                    {{ define "custom_tg_alert" }}
                    {{ range .Alerts }}
                    {{ if eq .Status "firing" }}🚨 <b>ALERT: FIRING!</b> 🚨{{ else }}✅ <b>ALERT: RESOLVED!</b> ✅{{ end }}
                    <b>Alert:</b> {{ .Labels.alertname }}
                    <b>App:</b> {{ .Labels.deployment }}
                    <b>Namespace:</b> {{ .Labels.namespace }}
                    {{ end }}
                    {{ end }}
                    ` }}
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
