# Adopts the loki-stack release that was helm-installed out-of-band on
# 2026-05-15 (adoption verified Synced before prune was enabled).
# loki-stack is deprecated upstream; migration to the loki chart is a
# ROADMAP item, not a reason to leave this unmanaged.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: loki-stack
    targetRevision: 2.10.3
    helm:
      releaseName: loki
      values: |
        loki:
          persistence:
            enabled: true
            size: 5Gi
        promtail:
          enabled: true
        # The bundled datasource ConfigMap declares Loki as the DEFAULT
        # grafana datasource, which collides with Prometheus and makes
        # grafana refuse to start. Datasources are declared in one place
        # instead: monitoring-stack.yaml additionalDataSources.
        grafana:
          sidecar:
            datasources:
              enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
