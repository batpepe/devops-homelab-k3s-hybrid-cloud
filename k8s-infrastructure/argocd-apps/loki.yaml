# Adopts the loki-stack release that was helm-installed out-of-band on
# 2026-05-15. Chart and values pinned to match the live release exactly.
# prune stays false until the app shows Synced; flip to true afterwards.
# loki-stack is deprecated upstream; migration to the loki chart is a
# ROADMAP item, not a reason to leave this unmanaged.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: loki-stack
    targetRevision: 2.10.3
    helm:
      releaseName: loki
      values: |
        loki:
          persistence:
            enabled: true
            size: 5Gi
        promtail:
          enabled: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
