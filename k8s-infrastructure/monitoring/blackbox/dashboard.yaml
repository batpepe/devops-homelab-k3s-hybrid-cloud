# Grafana dashboard for the blackbox probes. The kube-prometheus-stack Grafana sidecar
# auto-imports any ConfigMap labelled grafana_dashboard: "1". The Prometheus datasource
# uid ("prometheus") matches the one defined in monitoring-stack.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  blackbox-exporter.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Probe success (1 = up)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "min": 0, "max": 1 }, "overrides": [] },
          "targets": [ { "expr": "probe_success", "legendFormat": "{{instance}}", "refId": "A" } ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Probe duration",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [ { "expr": "probe_duration_seconds", "legendFormat": "{{instance}}", "refId": "A" } ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "HTTP status code",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [ { "expr": "probe_http_status_code", "legendFormat": "{{instance}}", "refId": "A" } ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "TLS cert days remaining",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 14 }, { "color": "green", "value": 30 } ] }
            },
            "overrides": []
          },
          "targets": [ { "expr": "(probe_ssl_earliest_cert_expiry - time()) / 86400", "legendFormat": "{{instance}}", "refId": "A" } ]
        }
      ],
      "schemaVersion": 39,
      "tags": [ "blackbox", "synthetic" ],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "title": "Synthetic Monitoring - Blackbox",
      "uid": "blackbox-synthetic",
      "version": 1
    }
