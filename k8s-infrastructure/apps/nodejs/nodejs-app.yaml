apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs
  template:
    metadata:
      labels:
        app: nodejs
    spec:
      containers:
        - name: nodejs
          image: ealen/echo-server:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-svc
  namespace: apps
spec:
  selector:
    app: nodejs
  ports:
    - port: 80
      targetPort: 80
