---
# Do NOT commit real values here. Create this secret manually:
# kubectl create secret generic postgres-secret -n apps \
#   --from-literal=POSTGRES_USER=devops \
#   --from-literal=POSTGRES_PASSWORD=<your-password> \
#   --from-literal=POSTGRES_DB=homelab_db
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: apps
stringData:
  POSTGRES_USER: devops
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: homelab_db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: apps
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
