apiVersion: apps/v1
kind: Deployment
metadata:
  name: batman-app
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batman
  template:
    metadata:
      labels:
        app: batman
    spec:
      containers:
      - name: batman
        image: ghcr.io/batpepe/batman-app:60e3088017c159e3bd627cba930fcb1023d2db25
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: batman-svc
  namespace: apps
spec:
  selector:
    app: batman
  ports:
  - port: 80
    targetPort: 80
---
# Public host routed by the Cloudflare Tunnel wildcard through Traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: batman-ingress
  namespace: apps
  annotations:
    # Shared security headers, defined once in apps/platform-security.
    traefik.ingress.kubernetes.io/router.middlewares: apps-security-headers@kubernetescrd
spec:
  rules:
  - host: game.batpepe.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: batman-svc
            port:
              number: 80
